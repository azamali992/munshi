<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Munshi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">Munshi</span></div>
    <div class="topbar-right"><span id="rolePill" class="pill role" hidden></span></div>
  </header>
  <main id="view" class="view"></main>
  <nav id="nav" class="nav" hidden>
    <a href="#today" data-tab="today"><span class="ico">◧</span><span>Today</span></a>
    <a href="#chat" data-tab="chat"><span class="ico">✎</span><span>Chat</span></a>
    <a href="#approvals" data-tab="approvals"><span class="ico">✓</span><span>Approve</span><b id="badge" class="badge" hidden></b></a>
    <a href="#khata" data-tab="khata"><span class="ico">☰</span><span>Khata</span></a>
    <a href="#more" data-tab="more"><span class="ico">⋯</span><span>More</span></a>
  </nav>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
